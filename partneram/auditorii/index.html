<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудитории JASA · партнёрам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F1E8; --paper2:#ECE6D9; --card:#FFFDF8; --ink:#15192A; --ink2:#4A4F63; --muted:#6B6F80;
  --line:#D9D2C3; --fire:#E8420F; --fire-soft:#FBE3D8; --ok:#2F7A4F; --ok-soft:#DDEFE3; --warn:#9A6A00; --warn-soft:#F6EBCB;
  --p5:#E8420F; --p4:#F08A4B; --p3:#C9B79A; --p2:#DCD3C2; --p1:#E8E2D6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12141D; --paper2:#1A1D29; --card:#1C2030; --ink:#F1ECE2; --ink2:#C3C0B8; --muted:#9A98A3;
    --line:#2E3345; --fire:#FF5A26; --fire-soft:#3A2119; --ok:#5FBF86; --ok-soft:#18301F; --warn:#E2B04A; --warn-soft:#33290F;
    --p5:#FF5A26; --p4:#C46A3A; --p3:#6E6553; --p2:#3E3A33; --p1:#2C2A27;
  }
}
:root[data-theme="dark"]{
  --paper:#12141D; --paper2:#1A1D29; --card:#1C2030; --ink:#F1ECE2; --ink2:#C3C0B8; --muted:#9A98A3;
  --line:#2E3345; --fire:#FF5A26; --fire-soft:#3A2119; --ok:#5FBF86; --ok-soft:#18301F; --warn:#E2B04A; --warn-soft:#33290F;
  --p5:#FF5A26; --p4:#C46A3A; --p3:#6E6553; --p2:#3E3A33; --p1:#2C2A27;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:Geologica,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(34px,6vw,64px);line-height:1.02;font-weight:700}
h2{font-size:clamp(24px,3.4vw,36px);line-height:1.1;font-weight:700;margin-bottom:18px}
h3{font-size:19px;font-weight:600;line-height:1.25}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
a{color:inherit}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:54px}
.logo{font-family:Geologica;font-weight:700;font-size:18px}
.logo b{color:var(--fire)}
nav{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;flex:1}
nav a{text-decoration:none;color:var(--ink2);font-size:14px;white-space:nowrap}
nav a:hover{color:var(--fire)}
.themebtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 12px;font:13px Onest;cursor:pointer}
section{padding:56px 0;border-bottom:1px solid var(--line)}
.hero{padding:64px 0 48px}
.hero p.lead{font-size:clamp(17px,2vw,20px);color:var(--ink2);max-width:760px;margin:20px 0 0}
.hero h1 span{color:var(--fire)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stat .n{font-family:Geologica;font-weight:700;font-size:clamp(26px,3.2vw,38px);line-height:1}
.stat .n small{font-size:.5em;font-weight:600}
.stat .t{font-size:14px;color:var(--ink2);margin-top:8px}
.stat .s{font-size:12px;color:var(--muted);margin-top:6px}
.concl{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;counter-reset:c}
.concl div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 18px 58px;position:relative;counter-increment:c}
.concl div::before{content:counter(c);position:absolute;left:18px;top:16px;width:28px;height:28px;border-radius:50%;background:var(--fire);color:#fff;font:600 14px/28px Geologica;text-align:center}
.concl b{display:block;font-family:Geologica;font-weight:600;font-size:17px;margin-bottom:4px}
.concl p{margin:0;color:var(--ink2);font-size:15px}
.top5{display:grid;gap:14px}
.t5{display:grid;grid-template-columns:64px 1fr 1fr 220px;gap:18px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.t5 .num{font-family:Geologica;font-weight:700;font-size:44px;line-height:1;color:var(--fire)}
.t5 h3{margin-bottom:6px}
.t5 p{margin:0;color:var(--ink2);font-size:15px}
.t5 .money{font-family:Geologica;font-weight:600;font-size:18px}
.t5 .money small{display:block;font:13px Onest;color:var(--muted);margin-top:4px}
.t5 .pipe{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-block;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);color:var(--ink)}
.arrow{color:var(--muted);font-size:12px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.box h3{margin-bottom:8px}
.box p,.box li{color:var(--ink2);font-size:15px}
.box ul{margin:0;padding-left:18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:13.5px Onest;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{width:100%;max-width:360px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:15px Onest;margin-bottom:12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}
th{position:sticky;top:0;background:var(--paper2);text-align:left;font:600 12px/1.3 Onest;color:var(--ink2);padding:10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--fire-soft) 45%,transparent)}
td .nm{font-weight:600}
td .sg{font-size:12px;color:var(--muted)}
.pr{display:inline-block;min-width:28px;text-align:center;border-radius:8px;padding:2px 6px;font:600 13px Geologica}
.pr5{background:var(--p5);color:#fff}.pr4{background:var(--p4);color:#fff}.pr3{background:var(--p3);color:var(--ink)}.pr2{background:var(--p2);color:var(--ink)}.pr1{background:var(--p1);color:var(--ink)}
.dots{letter-spacing:2px;color:var(--fire);white-space:nowrap}
.dots i{color:var(--line);font-style:normal}
tr.det td{background:var(--paper2);font-size:14px;color:var(--ink2)}
tr.det b{color:var(--ink)}
.gaps{display:grid;gap:8px}
.gap{display:grid;grid-template-columns:280px 1fr 40px;gap:12px;align-items:center}
.gap .bar{height:14px;border-radius:7px;background:var(--fire)}
.gap .lbl{font-size:15px}
.gap .v{font:600 15px Geologica;text-align:right}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.road .box .mono{color:var(--fire)}
.ver td,.ver th{font-size:13.5px}
.ok{color:var(--ok);font-weight:600}
.note{font-size:13.5px;color:var(--muted);margin-top:14px}
footer{padding:36px 0 60px;color:var(--muted);font-size:14px}
@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .concl,.side,.road{grid-template-columns:1fr}
  .t5{grid-template-columns:44px 1fr}
  .t5 .num{font-size:32px}
  .t5 > div:nth-child(3),.t5 > div:nth-child(4){grid-column:2}
  .gap{grid-template-columns:1fr 36px}
  .gap .lbl{grid-column:1/3}
}
@media (max-width:700px){.tbl.main{display:none}.cards{display:grid;gap:10px}}
.cards{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card .nm{font-weight:600}.card .sg{font-size:12px;color:var(--muted)}
.card dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px}.card dt{color:var(--muted)}.card dd{margin:0}
.prog td:first-child{color:var(--ink2)}.prog td{min-width:150px}
@media (max-width:560px){
  .wrap{padding:0 16px}
  section{padding:40px 0}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:14px}
  header.top nav{display:none}
}
</style>

<meta name="robots" content="noindex,nofollow">
<style>
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper)}
.gate form{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.gate .logo{font-family:Geologica;font-weight:700;font-size:20px;margin-bottom:14px}.gate .logo b{color:var(--fire)}
.gate h1{font-size:26px;line-height:1.1;margin:0 0 8px}
.gate p{color:var(--ink2);font-size:15px;margin:0 0 18px}
.gate input{width:100%;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:12px;padding:12px 14px;font:18px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.gate button{margin-top:12px;width:100%;border:0;background:var(--fire);color:#fff;border-radius:12px;padding:12px;font:600 16px Onest;cursor:pointer}
.gate .err{color:var(--fire);font-size:14px;min-height:20px;margin-top:10px}
.gate .foot{font-size:12.5px;color:var(--muted);margin-top:16px}
</style>
</head>

<button type="submit">Открыть</button>
<div class="err" id="ge"></div>
<div class="foot">jasa.asia · разбор аудиторий · ноябрь 2026</div>
</form></div>

(function(){
  var P=JSON.parse(document.getElementById("payload").textContent), te=new TextEncoder(), td=new TextDecoder();

  async function open(code){
